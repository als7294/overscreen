<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090C">
<title>SamSUCKED Remote</title>
<style>
  :root { --bg: #07090C; --key: #14181E; --key-on: #1E252D; --line: rgba(129, 216, 208, 0.16); --text: #EAF6F5; --dim: #7E8C8B; --tiff: #0ABAB5; --tiff2: #81D8D0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 15px/1.2 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  main { max-width: 420px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 22px; min-height: 100%; }
  header { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 800; letter-spacing: 0.14em; font-size: 17px; transform: scaleX(1.25); transform-origin: left; }
  .status { font-size: 13px; color: var(--dim); }
  .status.ok { color: var(--tiff2); }
  button { appearance: none; border: 1px solid var(--line); background: var(--key); color: var(--text); border-radius: 18px; font: inherit; display: flex; align-items: center; justify-content: center; transition: background 80ms, transform 80ms; }
  button:active, button.on { background: var(--key-on); transform: scale(0.96); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .row button { height: 58px; }
  .pad { position: relative; width: min(84vw, 330px); aspect-ratio: 1; margin: 6px auto; border-radius: 50%; background: var(--key); border: 1px solid var(--line); }
  .pad button { position: absolute; border: 0; background: transparent; border-radius: 0; color: var(--dim); font-size: 22px; }
  .pad .up { left: 30%; right: 30%; top: 0; height: 30%; }
  .pad .down { left: 30%; right: 30%; bottom: 0; height: 30%; }
  .pad .left { top: 30%; bottom: 30%; left: 0; width: 30%; }
  .pad .right { top: 30%; bottom: 30%; right: 0; width: 30%; }
  .pad .ok { left: 31%; right: 31%; top: 31%; bottom: 31%; border-radius: 50%; background: linear-gradient(135deg, var(--tiff), var(--tiff2)); color: #04211F; font-weight: 800; font-size: 17px; letter-spacing: 0.06em; }
  .pad .up:active, .pad .down:active, .pad .left:active, .pad .right:active { color: var(--tiff2); background: transparent; }
  .vol { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .vol .stack { display: grid; grid-template-rows: 1fr 1fr; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
  .vol .stack button { border: 0; border-radius: 0; height: 58px; }
  .vol .stack button + button { border-top: 1px solid var(--line); }
  .label { font-size: 12px; color: var(--dim); text-align: center; margin-top: -14px; }
  .missing { margin: auto; text-align: center; color: var(--dim); line-height: 1.5; }
  .copy { height: 54px; font-weight: 700; color: var(--tiff2); }
  .hint { margin: -10px 0 0; text-align: center; font-size: 13px; color: var(--dim); }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<main id="app">
  <header><span class="logo">SΛM<span style="color:#8DB4FF">SUCK</span>ED</span><span class="status" id="status">Ready</span></header>
  <div class="row">
    <button data-k="KEY_POWER" aria-label="Power"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
    <button data-k="APP:SamSucks01.samsucks">SamSUCKED</button>
    <button data-k="KEY_HOME" aria-label="TV home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
  </div>
  <div class="pad">
    <button class="up" data-k="KEY_UP" aria-label="Up">▲</button>
    <button class="left" data-k="KEY_LEFT" aria-label="Left">◀</button>
    <button class="ok" data-k="KEY_ENTER">OK</button>
    <button class="right" data-k="KEY_RIGHT" aria-label="Right">▶</button>
    <button class="down" data-k="KEY_DOWN" aria-label="Down">▼</button>
  </div>
  <div class="row">
    <button data-k="KEY_RETURN" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button data-k="KEY_PLAY_BACK" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M5 4l9 8-9 8zM16 5v14M20 5v14"/></svg></button>
    <button data-k="KEY_MUTE" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l4 6M21 9l-4 6"/></svg></button>
  </div>
  <div class="vol">
    <div class="stack"><button data-k="KEY_VOLUP" aria-label="Volume up">+</button><button data-k="KEY_VOLDOWN" aria-label="Volume down">−</button></div>
    <div class="stack"><button data-k="KEY_CHUP" aria-label="Channel up">⌃</button><button data-k="KEY_CHDOWN" aria-label="Channel down">⌄</button></div>
  </div>
  <div class="vol"><div class="label">Volume</div><div class="label">Channel</div></div>
  <button id="copy" class="copy">Copy link for laptop</button>
  <p class="hint">Or use Safari's share button to AirDrop this page to your Mac.</p>
</main>
<script>
  const secret = (location.hash.slice(1) || localStorage.getItem('samsucksSecret') || '').toLowerCase();
  const status = document.getElementById('status');
  if (!/^[0-9a-f]{32}$/.test(secret)) {
    document.getElementById('app').innerHTML = '<p class="missing">Scan the QR code on the SamSUCKED lockscreen to pair this phone.</p>';
  } else {
    try { localStorage.setItem('samsucksSecret', secret); } catch (e) {}
    const fullLink = location.origin + '/r#' + secret;
    history.replaceState(null, '', '/r'); // keep the secret out of the visible URL
    // Copy the paired link (works on plain http; Universal Clipboard carries it to the Mac).
    document.getElementById('copy').addEventListener('click', () => {
      const t = document.createElement('textarea');
      t.value = fullLink; document.body.appendChild(t); t.select(); t.setSelectionRange(0, 9999);
      const ok = document.execCommand('copy'); t.remove();
      document.getElementById('copy').textContent = ok ? 'Copied: paste it on your laptop' : fullLink;
    });
    const send = key => fetch('/k/' + secret, { method: 'POST', body: key })
      .then(r => { status.textContent = r.ok ? 'Sent' : 'Error'; status.className = 'status' + (r.ok ? ' ok' : ''); })
      .catch(() => { status.textContent = 'Offline'; status.className = 'status'; });
    // Laptop: drive it from the keyboard too.
    const KEYS = { ArrowUp: 'KEY_UP', ArrowDown: 'KEY_DOWN', ArrowLeft: 'KEY_LEFT', ArrowRight: 'KEY_RIGHT', Enter: 'KEY_ENTER',
      Escape: 'KEY_RETURN', Backspace: 'KEY_RETURN', ' ': 'KEY_PLAY_BACK', '+': 'KEY_VOLUP', '=': 'KEY_VOLUP', '-': 'KEY_VOLDOWN',
      m: 'KEY_MUTE', h: 'KEY_HOME' };
    addEventListener('keydown', e => {
      const k = KEYS[e.key] || KEYS[e.key.toLowerCase()];
      if (!k) return;
      e.preventDefault();
      send(k);
      const b = document.querySelector('[data-k="' + k + '"]');
      if (b) { b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 120); }
    });
    let repeat = 0;
    document.querySelectorAll('[data-k]').forEach(b => {
      const k = b.dataset.k;
      const stop = () => { clearInterval(repeat); clearTimeout(repeat); b.classList.remove('on'); };
      b.addEventListener('pointerdown', e => {
        e.preventDefault();
        b.classList.add('on');
        if (navigator.vibrate) navigator.vibrate(8);
        send(k);
        // Hold arrows and volume to repeat.
        if (/UP|DOWN|LEFT|RIGHT|VOL/.test(k)) repeat = setTimeout(() => { repeat = setInterval(() => send(k), 140); }, 420);
      });
      b.addEventListener('pointerup', stop);
      b.addEventListener('pointerleave', stop);
      b.addEventListener('pointercancel', stop);
    });
  }
</script>
</body>
</html>
